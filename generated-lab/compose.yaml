name: topology-lab
services:
  client-1:
    build:
      context: .
      dockerfile: dockerfiles/client-1.Dockerfile
    container_name: "attacker"
    hostname: "attacker"
    labels:
      topology.name: "attacker"
      topology.role: "client"
    cap_add:
      - NET_ADMIN
    command: ["sh", "-c", "ip route replace 192.168.4.0/24 via 192.168.2.10 && tail -f /dev/null"]
    networks:
      net_link_link-1:
        ipv4_address: 192.168.2.100
        mac_address: 02:42:c8:00:01:01
  router-1:
    build:
      context: .
      dockerfile: dockerfiles/router-1.Dockerfile
    container_name: "router"
    hostname: "router"
    labels:
      topology.name: "router"
      topology.role: "router"
    platform: linux/arm64
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    command: ["sh", "-c", "tail -f /dev/null"]
    networks:
      net_link_link-1:
        ipv4_address: 192.168.2.10
        mac_address: 02:42:c8:00:01:02
      net_sw_switch-1:
        ipv4_address: 192.168.4.10
        mac_address: 02:42:ac:11:00:02
  server-1:
    build:
      context: .
      dockerfile: dockerfiles/server-1.Dockerfile
    container_name: "server"
    hostname: "server"
    labels:
      topology.name: "server"
      topology.role: "server"
    cap_add:
      - NET_ADMIN
    command: ["sh", "-c", "ip route replace 192.168.2.0/24 via 192.168.4.10 && python3 -m http.server 8000 --bind 0.0.0.0"]
    networks:
      net_sw_switch-1:
        ipv4_address: 192.168.4.105
        mac_address: 02:42:ac:11:00:03
  client-2:
    build:
      context: .
      dockerfile: dockerfiles/client-2.Dockerfile
    container_name: "client2"
    hostname: "client2"
    labels:
      topology.name: "client2"
      topology.role: "client"
    cap_add:
      - NET_ADMIN
    command: ["sh", "-c", "ip route replace 192.168.2.0/24 via 192.168.4.10 && tail -f /dev/null"]
    networks:
      net_sw_switch-1:
        ipv4_address: 192.168.4.67
        mac_address: 02:42:ac:11:00:04
  client-3:
    build:
      context: .
      dockerfile: dockerfiles/client-3.Dockerfile
    container_name: "client3"
    hostname: "client3"
    labels:
      topology.name: "client3"
      topology.role: "client"
    cap_add:
      - NET_ADMIN
    command: ["sh", "-c", "ip route replace 192.168.2.0/24 via 192.168.4.10 && tail -f /dev/null"]
    networks:
      net_sw_switch-1:
        ipv4_address: 192.168.4.68
        mac_address: 02:42:ac:11:00:05
  client-4:
    build:
      context: .
      dockerfile: dockerfiles/client-4.Dockerfile
    container_name: "client1"
    hostname: "client1"
    labels:
      topology.name: "client1"
      topology.role: "client"
    cap_add:
      - NET_ADMIN
    command: ["sh", "-c", "ip route replace 192.168.2.0/24 via 192.168.4.10 && tail -f /dev/null"]
    networks:
      net_sw_switch-1:
        ipv4_address: 192.168.4.61
        mac_address: 02:42:ac:11:00:01
networks:
  net_link_link-1:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.2.0/24
  net_sw_switch-1:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.4.0/24
